version = 1
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version >= '3.11'",
]

[[package]]
name = "fake-osv-fixture-app"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "flask" },
    { name = "jinja2" },
    { name = "requests" },
    { name = "urllib3" },
    { name = "werkzeug" },
]

[package.metadata]
requires-dist = [
    { name = "flask", specifier = "==3.0.3" },
    { name = "jinja2", specifier = "==3.1.4" },
    { name = "requests", specifier = "==2.32.3" },
    { name = "urllib3", specifier = "==2.2.2" },
    { name = "werkzeug", specifier = "==3.0.3" },
]

[[package]]
name = "flask"
version = "3.0.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "blinker" },
    { name = "click" },
    { name = "itsdangerous" },
    { name = "jinja2" },
    { name = "werkzeug" },
]

[[package]]
name = "jinja2"
version = "3.1.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "markupsafe" },
]

[[package]]
name = "requests"
version = "2.32.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "charset-normalizer" },
    { name = "idna" },
    { name = "urllib3" },
]

[[package]]
name = "urllib3"
version = "2.2.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "werkzeug"
version = "3.0.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "markupsafe" },
]
